[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-project"          # TODO: rename per project
version = "0.1.0"
description = "TODO: one-line description"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"},  # TODO
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

# ── Core dependencies ────────────────────────────────────────────────
# Strip unused deps and add project-specific ones per project.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Add as needed: pooch, statsmodels, pandera, xarray, pingouin, geopandas, etc.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pkg*"]                   # TODO: update when renaming src/pkg/

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
