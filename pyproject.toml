[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ted-keyword-popularity-analysis"
version = "0.1.0"
description = "TED Keyword Popularity Analysis — which keywords are most globally prominent across all public TED Talks, using Term Frequency weighted by view count"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Rong Zhou", email = "rong.zhou@example.com"},
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
]

# ── Core dependencies ────────────────────────────────────────────────
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "nltk>=3.8",
    "google-api-python-client>=2.120",
    "yt-transcript-pro>=2.0",
    "pandera>=0.18",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ted_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
